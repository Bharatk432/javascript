<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function and operator</title>

    <script>
        

        function operatorRule(){
            let a = 10;
            let b = 5;

            console.log(a + b);
            console.log(a - b);
            console.log(a * b);
            console.log(a / b);
            console.log(a ** b);
            console.log(a % b);

            console.log(a++);
            console.log(a);

            console.log(a--);
            console.log(a);

            console.log("10" + b);
            console.log("10" - b);
            console.log("10" * b);
            console.log("10" / b);

            console.log("pqr" / 4);

            console.log(true / true);
        }
    </script>
</head>
<body>
    <h1>function and operators </h1>
    <button onclick="operatorRule()">show result</button>
</body>
</html>
