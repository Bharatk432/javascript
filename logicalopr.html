<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical operators</title>
    <script>
        let x = 10;
        let y = 10;

        if(x === 10 && y === 10){
            console.log("this is correct number");
        }else{
            console.log("this is wrong number");
        }

        let name = "Bharat";
        let age = 25;

        if(name === "Bharat" && age === 25){
            console.log("Yes! Im Bharat and my age is 25 year old.")
        }else{
            console.log("Sorry! I'm Not a bharat");
        }

        let userName = "Ajay";
        let password = "Admin@8269";

        if(userName === "Ajay" && password === "Admin@8269"){
            console.log("Login Successful");
        }else{
            console.log("Invalid Username or Password");
        }

        let role = "admin";
        let isLoggedIn = false;

        if(role === "admin" || isLoggedIn === false){
            console.log("Access Granted");
        }else{
            console.log("Access Denied");
        }
    </script>
</head>
<body>
    <h1>Logical Operators</h1>
</body>
</html>
