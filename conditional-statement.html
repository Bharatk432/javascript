<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statement</title>

    <script>
        const mark = 80;

        if (mark >= 75) {
            console.log("Grade A");
        } else if (mark >= 55 && mark < 75) {
            console.log("Grade B");
        } else if (mark >= 35 && mark < 55) {
            console.log("Grade C");
        } else {
            console.log("Fail")
        }

    </script>

</head>

<body>
    <h1>Conditional Statement</h1>
</body>

</html>
