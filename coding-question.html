<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Question</title>
    <script>

        // Voting Eligibility

        let age = 20;
        let voterId = true;

        if (age >= 18 && voterId) {
            console.log("Eligible for Voting");
        } else {
            console.log("Not Eligible for Voting");
        }

        // Login System

        let userName = "Bharat";
        let password = "12345";

        if (userName === "Bharat" && password === "12345") {
            console.log("Login Success");
        } else {
            console.log("Login Failed");
        }

        // Student Grade

        let mark = 68;

        if (mark > 75) {
            console.log("Grade A");
        } else if (mark > 55) {
            console.log("Grade B");
        } else if (mark > 35) {
            console.log("Grade C");
        } else {
            console.log("Fail");
        }

        // Day Name Using Switch

        let day = 5;

        switch (day) {
            case 1:
                console.log("Monday");
                break
            case 2:
                console.log("Tuesday");
                break
            case 3:
                console.log("Wednesday");
                break
            case 4:
                console.log("Thursday");
                break
            case 5:
                console.log("Friday");
                break
            case 6:
                console.log("saturday");
                break
            case 7:
                console.log("Sunday");
                break
            default:
                console.log("Invalid Day");
        }

        // Access Control

        let role = "user";
        let isLoggedIn = true;

        if (role === "Admin" || isLoggedIn) {
            console.log("Access Granted");
        } else {
            console.log("Access Denied");
        }
    </script>
</head>

<body>
    <h1>Coding Questions for Practice</h1>
</body>

</html>
